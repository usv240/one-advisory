<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">One Advisory managed enterprise architecture</title><desc id="desc">Four registered capabilities run with distinct Agent Identities behind a shared governed gateway, alongside live Model Armor resources, Firestore memory and Cloud Trace.</desc><rect width="1500" height="760" fill="#0c1820"/><style>.h{font:700 34px Arial;fill:#f3fbff}.k{font:700 14px Arial;fill:#68dde0;letter-spacing:2px}.t{font:700 19px Arial;fill:#f3fbff}.n{font:14px Arial;fill:#a9c1cc}.b{fill:#142833;stroke:#466674;stroke-width:2}.c{fill:#123139;stroke:#54d3d5;stroke-width:2}.s{fill:#302b19;stroke:#edc66a;stroke-width:2}.a{stroke:#68dde0;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#68dde0"/></marker></defs><text x="55" y="55" class="h">One Advisory · managed enterprise control plane</text><text x="55" y="84" class="n">Live proof: /api/platform · synthetic data · consequential authority remains human</text><rect class="s" x="55" y="145" rx="18" width="275" height="115"/><text x="80" y="180" class="k">OFFICIAL AUTHORITY</text><text x="80" y="218" class="t">Authorized advisory</text><text x="80" y="244" class="n">Named commander · zone · time</text><path class="a" d="M330 202H410"/><rect class="c" x="410" y="125" rx="18" width="310" height="155"/><text x="438" y="160" class="k">UNIFIED ROUTING</text><text x="438" y="198" class="t">Managed Agent Gateway</text><text x="438" y="224" class="n">MCP · CLIENT_TO_AGENT</text><text x="438" y="248" class="n">One governed cross-project path</text><path class="a" d="M720 202H800"/><rect class="c" x="800" y="105" rx="18" width="645" height="200"/><text x="830" y="140" class="k">MANAGED AGENT RUNTIME · SCALE TO ZERO</text><text x="830" y="178" class="t">Facility fleet</text><text x="1080" y="178" class="t">Policy gateway</text><text x="830" y="225" class="t">Resource coordinator</text><text x="1080" y="225" class="t">Recovery verifier</text><text x="830" y="272" class="n">4 immutable Agent Identities · typed state-bound commands gate the main workflow</text><path class="a" d="M1120 305V370"/><rect class="s" x="800" y="370" rx="18" width="645" height="105"/><text x="830" y="405" class="k">MANAGED SECURITY RESOURCES</text><text x="830" y="440" class="t">Two live regional Model Armor templates</text><text x="1220" y="440" class="n">inline attachment not claimed</text><path class="a" d="M800 422H720"/><rect class="b" x="410" y="350" rx="18" width="310" height="145"/><text x="438" y="385" class="k">APPLICATION PLANE</text><text x="438" y="423" class="t">Cloud Run · FastAPI</text><text x="438" y="451" class="n">Strict state machine · human gates</text><text x="438" y="475" class="n">Gemini 3.5 Flash + Embedding 001 routing</text><path class="a" d="M565 495V560"/><rect class="b" x="290" y="560" rx="18" width="550" height="125"/><text x="320" y="596" class="k">DURABLE STATE</text><text x="320" y="632" class="t">Firestore incidents · facility memory · transactional wakes</text><text x="320" y="660" class="n">leases · idempotency · bounded retry · dead letters · no transcript replay</text><path class="a" d="M840 622H920"/><rect class="b" x="920" y="540" rx="18" width="525" height="165"/><text x="950" y="576" class="k">OBSERVABILITY + AUDIT</text><text x="950" y="614" class="t">OpenTelemetry · Cloud Trace</text><text x="950" y="642" class="n">Request correlation · ordered timeline</text><text x="950" y="670" class="n">Agent Registry discovery · /api/platform live evidence</text></svg>
