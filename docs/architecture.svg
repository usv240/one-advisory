<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="t d"><title id="t">One Advisory architecture</title><desc id="d">Authorized advisory flows through a policy-gated fleet on Google Cloud to human-approved facility actions and recovery evidence.</desc><rect width="1400" height="650" fill="#10161c"/><style>.h{font:700 30px Arial;fill:#edf7ff}.s{font:600 15px Arial;fill:#7fd5e8}.b{font:600 18px Arial;fill:#edf7ff}.n{font:14px Arial;fill:#a9bdc8}.box{fill:#18232b;stroke:#3f5967;stroke-width:2}.g{fill:#173238;stroke:#4fc5c9;stroke-width:2}.human{fill:#243220;stroke:#8dd477;stroke-width:2}.a{stroke:#7fd5e8;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7fd5e8"/></marker></defs><text x="55" y="58" class="h">One Advisory — authority-aware fleet</text><text x="55" y="88" class="n">Post-notification operational response · all people, facilities and connectors are synthetic</text><rect class="box" x="55" y="155" rx="18" width="270" height="150"/><text class="s" x="80" y="190">AUTHORIZED INPUT</text><text class="b" x="80" y="230">Advisory artifact</text><text class="n" x="80" y="258">Zone · type · time · authority</text><text class="n" x="80" y="282">Gemini exact-quote reader</text><path class="a" d="M325 230H430"/><rect class="g" x="430" y="125" rx="18" width="420" height="300"/><text class="s" x="460" y="165">GOOGLE CLOUD CONTROL PLANE</text><text class="b" x="460" y="205">Cloud Run · FastAPI fleet</text><text class="n" x="460" y="235">Registry · policy gateway · task orchestration</text><text class="b" x="460" y="285">Vertex AI · Gemini 3.5 Flash + Embedding 001</text><text class="n" x="460" y="315">Bounded reading and source-grounded proposals</text><text class="b" x="460" y="365">Firestore-compatible state</text><text class="n" x="460" y="395">Tasks · evidence · approvals · audit history</text><path class="a" d="M850 230H955"/><rect class="human" x="955" y="155" rx="18" width="390" height="150"/><text class="s" x="980" y="190">HUMAN AUTHORITY</text><text class="b" x="980" y="230">Incident commander</text><text class="n" x="980" y="258">Approves delivery and resource allocation</text><text class="n" x="980" y="282">Authorized source controls rescission</text><path class="a" d="M1150 305V390"/><rect class="box" x="955" y="390" rx="18" width="390" height="175"/><text class="s" x="980" y="425">CONTROLLED OUTCOME</text><text class="b" x="980" y="465">Dialysis · school · long-term care</text><text class="n" x="980" y="493">Acknowledgement · evidence · assistance</text><text class="n" x="980" y="517">Escalation · differentiated recovery</text><text class="n" x="980" y="541">Ordered after-action record</text><path class="a" d="M955 480H845"/><rect class="box" x="430" y="475" rx="18" width="415" height="90"/><text class="b" x="458" y="515">Executable controls</text><text class="n" x="458" y="542">reject unsupported policy · AI allocates nobody</text></svg>
